<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>
</head>
<body>

<table style="width: 100%; height: 200px; border-collapse: collapse;">
    <tr>
        <td style="background-color: lightblue; text-align: center; border: 1px solid black;">
            Hello
        </td>
        <td style="background-color: lightgreen; text-align: center; border: 1px solid black;">
            World
        </td>
    </tr>
</table>

</body>
</html>
