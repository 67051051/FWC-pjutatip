<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            text-align: center;
            font-size: 5vw;
            border: 1px solid black;
            word-wrap: break-word;
        }

        td:first-child {
            background-color: lightblue;
        }

        td:last-child {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <td>Hello</td>
        <td>World</td>
    </tr>
</table>

</body>
</html>
