<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: white;
            font-size: 60px;
        }
        .shops {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }
        .shop {
            text-align: center;
        }
        .shop img {
            width: 200px;
            height: auto;
        }
        hr {
            margin-top: 40px;
        }
        footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>&#9733; Welcome to my shops page &#9733;</h1>

    <div class="shops">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <br>
            <a href="https://www.amazon.com">Amazon</a>
        </div>
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <br>
            <a href="https://www.ebay.com">eBay</a>
        </div>
    </div>

    <hr>

    <footer>
        &copy; wil 2026
    </footer>

</body>
</html>
